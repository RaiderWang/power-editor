# Release pipeline — triggered by pushing a version tag (e.g. v0.1.5).
#
# Flow:
#   1. Tag push  →  builds native installer on Windows, macOS (arm64 + x64), Linux
#   2. Uploads artefacts to GitHub Release
#
# Platforms produced:
#   Windows   →  .msi + .exe (NSIS) installer
#   macOS     →  .dmg (universal via separate arm64 / x64 jobs)
#   Linux     →  .AppImage + .deb
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*.*.*'                      # v0.1.5
      - 'v*.*.*-*'                    # v0.1.5-beta.1
  workflow_dispatch:                    # allow manual trigger from Actions UI
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.5)'
        required: true

jobs:
  build:
    name: build · ${{ matrix.label }}
    permissions:
      contents: write       # needed to create / update the GitHub Release

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ────────────────────────────────────────────────────────
          - label: windows-x64
            os: windows-latest
            args: ''

          # ── macOS ARM (Apple Silicon) ───────────────────────────────────────
          - label: macos-arm64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin

          # ── macOS Intel ─────────────────────────────────────────────────────
          - label: macos-x64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin

          # ── Linux ──────────────────────────────────────────────────────────
          - label: linux-x64
            os: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Node (Tauri CLI is an npm dev-dep) ──────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target || '' }}

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.label }}

      # ── Linux system deps ───────────────────────────────────────────────────
      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Node deps (Tauri CLI) ───────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci || npm install

      # ── Build + publish ─────────────────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Power Editor ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Power Editor ${{ inputs.tag || github.ref_name }}

            ### 📦 Installation Guide / 安装指南

            #### 🍎 macOS
            - **Homebrew Cask (Recommended / 推荐)**:
              ```bash
              brew install --cask raiderwang/tap/power-editor
              ```
              *Automatically bypasses Gatekeeper quarantine, no extra command needed.*  
              *（自动处理未签名隔离属性，安装后可直接启动，无需额外命令）*

            - **Manual Download (.dmg)**:
              - Apple Silicon (M-series): `Power.Editor_*_aarch64.dmg`
              - Intel: `Power.Editor_*_x64.dmg`
              - **If macOS prompts "Power Editor is damaged and can't be opened"（提示已损坏）**, run this command in terminal to clear the quarantine attribute:
                ```bash
                xattr -cr "/Applications/Power Editor.app"
                ```

            #### 🪟 Windows
            - Download `.msi` (recommended) or `.exe` (NSIS) installer.
            - If Windows SmartScreen prompts on launch, click **More info → Run anyway**（点击“更多信息” → “仍要运行”）.

            #### 🐧 Linux
            - Download `.AppImage`, `.deb`, or `.rpm`.

            ---

            ### ⚙️ System Requirements
            - Windows 10/11 x64
            - macOS 12+ (Apple Silicon / Intel)
            - Linux (x86_64)

            ### 📄 License
            MIT License
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # ── Update Release Notes with CHANGELOG ─────────────────────────────────────
  update-release-notes:
    name: update · release-notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update GitHub Release notes from CHANGELOG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 .github/update_release_notes.py "$TAG"

  # ── Sync Cask to raiderwang/homebrew-tap ─────────────────────────────────────
  update-cask:
    name: update · homebrew-cask
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'RaiderWang/power-editor'
    steps:
      - name: Sync Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_SYNC }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning ::HOMEBREW_TAP_TOKEN secret is not set. Skipping Cask update."
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "Updating Cask for Power Editor v${VERSION}..."

          ARM_URL="https://github.com/RaiderWang/power-editor/releases/download/${TAG}/Power.Editor_${VERSION}_aarch64.dmg"
          X64_URL="https://github.com/RaiderWang/power-editor/releases/download/${TAG}/Power.Editor_${VERSION}_x64.dmg"

          echo "Downloading DMG assets..."
          DOWNLOAD_OK=false
          for i in {1..12}; do
            if curl -fsSL "$ARM_URL" -o arm.dmg && curl -fsSL "$X64_URL" -o x64.dmg; then
              DOWNLOAD_OK=true
              echo "DMG assets downloaded successfully."
              break
            fi
            echo "Waiting for release assets to be available... ($i/12)"
            sleep 10
          done

          if [ "$DOWNLOAD_OK" != "true" ]; then
            echo "::error ::Failed to download release DMG assets."
            exit 1
          fi

          export SHA_ARM=$(sha256sum arm.dmg | awk '{print $1}')
          export SHA_X64=$(sha256sum x64.dmg | awk '{print $1}')
          export VERSION

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/RaiderWang/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          python3 -c '
          import os
          v = os.environ["VERSION"]
          arm = os.environ["SHA_ARM"]
          x64 = os.environ["SHA_X64"]
          content = """cask "power-editor" do
            arch arm: "aarch64", intel: "x64"

            version "__VERSION__"
            sha256 arm:   "__SHA_ARM__",
                   intel: "__SHA_X64__"

            url "https://github.com/RaiderWang/power-editor/releases/download/v#{version}/Power.Editor_#{version}_#{arch}.dmg"
            name "Power Editor"
            desc "High-performance text editor optimized for large files"
            homepage "https://github.com/RaiderWang/power-editor"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Power Editor.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Power Editor.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/com.rickeditor.powereditor",
              "~/Library/Caches/com.rickeditor.powereditor",
              "~/Library/Preferences/com.rickeditor.powereditor.plist",
              "~/Library/Saved Application State/com.rickeditor.powereditor.savedState",
            ]
          end
          """.replace("__VERSION__", v).replace("__SHA_ARM__", arm).replace("__SHA_X64__", x64)
          with open("Casks/power-editor.rb", "w", encoding="utf-8") as f:
              f.write(content.strip() + "\n")
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/power-editor.rb
          git commit -m "chore(power-editor): bump to v${VERSION}" || exit 0
          git push origin main

